@if (render()) { @if (flight(); as f) {
<div
  class="flight"
  [class.rtl]="f.direction === 'rtl'"
  [class.flipped]="(f.direction === 'rtl') !== (f.variant === 'backwards')"
  [style.--xmas-santa-duration]="duration() + 'ms'"
  [attr.data-direction]="f.direction"
  [attr.data-variant]="f.variant"
  [attr.data-cargo]="cargo()"
  data-xmas-santa-flight
>
  <svg class="art" viewBox="-130 0 490 90" focusable="false" aria-hidden="true">
    @if (f.variant === 'chaser') {
    <g class="chaser" transform="translate(-118 30) scale(0.85)">
      <g xmas-reindeer phase="-0.2s"></g>
    </g>
    } @else {
    <g class="trail">
      <path
        class="sparkle"
        style="--i: 0"
        d="M-12 44 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6 z"
      />
      <path
        class="sparkle"
        style="--i: 1"
        d="M-30 58 l1.2 3 l3 1.2 l-3 1.2 l-1.2 3 l-1.2 -3 l-3 -1.2 l3 -1.2 z"
      />
      <path
        class="sparkle"
        style="--i: 2"
        d="M-46 40 l1.4 3.4 l3.4 1.4 l-3.4 1.4 l-1.4 3.4 l-1.4 -3.4 l-3.4 -1.4 l3.4 -1.4 z"
      />
      <path
        class="sparkle"
        style="--i: 3"
        d="M-64 54 l1 2.6 l2.6 1 l-2.6 1 l-1 2.6 l-1 -2.6 l-2.6 -1 l2.6 -1 z"
      />
      <path
        class="sparkle"
        style="--i: 4"
        d="M-80 44 l1.2 3 l3 1.2 l-3 1.2 l-1.2 3 l-1.2 -3 l-3 -1.2 l3 -1.2 z"
      />
      <path
        class="sparkle"
        style="--i: 5"
        d="M-98 60 l0.8 2 l2 0.8 l-2 0.8 l-0.8 2 l-0.8 -2 l-2 -0.8 l2 -0.8 z"
      />
      <path
        class="sparkle"
        style="--i: 6"
        d="M-112 48 l0.9 2.2 l2.2 0.9 l-2.2 0.9 l-0.9 2.2 l-0.9 -2.2 l-2.2 -0.9 l2.2 -0.9 z"
      />
      <circle class="sparkle dot" style="--i: 7" cx="-22" cy="52" r="1.2" />
      <circle class="sparkle dot" style="--i: 8" cx="-56" cy="48" r="1" />
      <circle class="sparkle dot" style="--i: 9" cx="-88" cy="54" r="0.9" />
    </g>
    }

    <!-- harness and reins -->
    <path class="harness" d="M116 58 L196 50 L264 48 L332 46" />
    <path class="reins" d="M84 44 Q140 44 196 49 M196 49 Q230 46 264 47 M264 47 Q300 44 332 45" />

    <g class="sleigh" (click)="dropPresent($event)" data-xmas-santa-sleigh>
      <g class="sleigh-bob" transform="translate(0 10)">
        @switch (cargo()) { @case ('presents') {
        <g class="cargo" data-cargo="presents">
          <rect class="box b1" x="6" y="22" width="18" height="18" rx="1.5" />
          <path class="ribbon" d="M15 22 V40 M6 31 H24" />
          <rect class="box b2" x="22" y="20" width="18" height="20" rx="1.5" />
          <path class="ribbon" d="M31 20 V40 M22 30 H40" />
          <rect class="box b3" x="10" y="6" width="15" height="16" rx="1.5" />
          <path class="ribbon" d="M17.5 6 V22 M10 14 H25" />
          <rect class="box b4" x="25" y="2" width="15" height="18" rx="1.5" />
          <path class="ribbon" d="M32.5 2 V20 M25 11 H40" />
          <rect class="box b5" x="16" y="-10" width="13" height="16" rx="1.5" />
          <path class="ribbon" d="M22.5 -10 V6 M16 -2 H29" />
          <path class="bow" d="M22.5 -10 c-4 -5 -8 -1 0 0 c8 -1 4 -5 0 0" />
          <path class="bow" d="M32.5 2 c-4 -5 -8 -1 0 0 c8 -1 4 -5 0 0" />
        </g>
        } @case ('sack') {
        <g class="cargo" data-cargo="sack">
          <path class="sack" d="M10 42 C5 30 10 16 22 13 C24 7 32 7 33 13 C44 17 48 30 43 42 Z" />
          <path class="sack-tie" d="M22 13 C25 15 30 15 33 13" />
          <rect class="box b4" x="20" y="4" width="10" height="8" rx="1" />
        </g>
        } }

        <!-- Santa -->
        <path class="coat" d="M46 42 C44 28 50 18 62 17 C74 17 80 28 78 42 Z" />
        <path class="coat" d="M70 26 C76 28 80 32 84 34 L82 38 C77 36 72 34 68 32 Z" />
        <circle class="mitten" cx="84" cy="36" r="3" />
        <path class="beard" d="M54 14 C54 25 58 31 63 31 C68 31 72 25 72 14 Z" />
        <circle class="skin" cx="63" cy="11.5" r="6.5" />
        <circle class="cheek" cx="66.5" cy="13" r="1.8" />
        <circle class="eye" cx="65" cy="9.6" r="0.9" />
        <path class="beard" d="M59 15 C61 12.5 66 12.5 69 15 C66 17.5 62 17.5 59 15 Z" />
        <path class="coat" d="M56 8 C55 0 61 -4 68 -3 C73 -2 75 3 72 7 C67 4.5 61 4.5 56 8 Z" />
        <path class="coat" d="M58 2 C55 -3 50 -2 46 3 L49 5 C52 2 55 1 58 4 Z" />
        <circle class="fur" cx="46" cy="4.5" r="3" />
        <rect class="fur" x="54" y="5.5" width="19" height="4.5" rx="2.2" />

        <!-- sled -->
        <path
          class="sled"
          d="M4 30 C2 22 8 16 14 19 C19 22 17 30 14 36 L20 40 H92 C108 40 116 50 110 62 C106 68 98 68 90 68 H18 C8 68 4 60 4 50 Z"
        />
        <path class="trim" d="M16 46 H96 C104 46 108 52 104 58" />
        <path class="trim" d="M9 26 C10 22 13 22 13 25" />
        <path class="runner" d="M6 76 H104 C118 76 124 70 122 62 C121 57 115 56 113 60" />
        <path class="runner" d="M24 67 V76 M60 67 V76 M92 67 V76" />
      </g>
    </g>

    <g xmas-reindeer transform="translate(150 26)" phase="-0.15s"></g>
    <g xmas-reindeer transform="translate(218 24)" phase="-0.3s"></g>
    <g xmas-reindeer [rudolph]="true" transform="translate(286 22)" phase="0s"></g>
  </svg>
</div>
} @for (present of presents(); track present.id) {
<div
  class="present"
  [style.left.px]="present.x"
  [style.--xmas-present-from]="present.y + 'px'"
  [style.--xmas-present-hue]="present.hue"
  data-xmas-present
>
  <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
    <rect class="present-box" x="2" y="8" width="20" height="15" rx="2" />
    <rect class="present-lid" x="1" y="6" width="22" height="5" rx="1.5" />
    <path class="present-ribbon" d="M12 6 V23" />
    <path class="present-bow" d="M12 6 C8 0 3 3 8 6 Z M12 6 C16 0 21 3 16 6 Z" />
  </svg>
</div>
} }
